name: Content snapshot

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update lessons content snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node with cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download content snapshot
        run: npm run content:snapshot

      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so CI has
      # to be started by hand (close and reopen the PR).
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/content-snapshot
          commit-message: "chore(lessons): update content snapshot"
          title: "chore(lessons): update content snapshot"
          body: "Weekly refresh of `assets/content/lessons.snapshot` from the production API."
          add-paths: assets/content/lessons.snapshot
          delete-branch: true
